[package]
name = "fourstory-account-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
fourstory-account-core = { path = "../core" }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
zeroize = "=1.8.2"
sha1 = "=0.10.6"
serde_json = "=1.0.149"
