[package]
name = "fourstory-account-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
fourstory-account-core = { path = "../core" }
axum = "=0.8.8"
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "=0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-util = { version = "=0.7.18", features = ["compat"] }
tiberius = { version = "=0.12.3", default-features = false, features = ["tds73", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha1 = "=0.10.6"
zeroize = { version = "=1.8.2", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
